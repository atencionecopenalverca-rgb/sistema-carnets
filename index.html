<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verificación de Carnet - EPS Eco Peñalver</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f6f9; margin: 0; padding: 0; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .card { background-color: white; width: 90%; max-width: 400px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); overflow: hidden; text-align: center; padding-bottom: 30px; display: none; }
        .header { background-color: #1b5e20; color: white; padding: 30px 10px 50px 10px; }
        .header h2 { margin: 0; font-size: 18px; letter-spacing: 1px; font-weight: normal; }
        .photo-container { margin-top: -60px; }
        .photo { width: 120px; height: 120px; border-radius: 50%; border: 5px solid white; object-fit: cover; background-color: #e0e0e0; box-shadow: 0 2px 5px rgba(0,0,0,0.2); }
        .name { font-size: 22px; font-weight: bold; color: #0a1128; margin: 15px 0 5px; padding: 0 10px; }
        .role { font-size: 16px; color: #546e7a; margin-bottom: 25px; font-weight: 500; text-transform: uppercase; }
        .details { text-align: left; padding: 0 30px; margin-bottom: 30px; }
        .detail-item { margin-bottom: 12px; font-size: 15px; border-bottom: 1px solid #eeeeee; padding-bottom: 8px; }
        .detail-label { font-weight: bold; color: #1b5e20; display: block; font-size: 13px; text-transform: uppercase; }
        .detail-value { color: #333; font-size: 16px; }
        .status-active { display: inline-block; background-color: #4caf50; color: white; padding: 10px 30px; border-radius: 25px; font-weight: bold; font-size: 18px; letter-spacing: 2px; box-shadow: 0 4px 6px rgba(76, 175, 80, 0.3); }
        
        #error-card { background-color: white; width: 90%; max-width: 400px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); padding: 40px 20px; text-align: center; display: none; }
        #error-card h1 { color: #d32f2f; font-size: 24px; }
        #error-card p { color: #555; }
    </style>
</head>
<body>

    <div class="card" id="profile-card">
        <div class="header">
            <h2>VERIFICACIÓN DE CREDENCIAL</h2>
        </div>
        <div class="photo-container">
            <img id="emp-photo" src="" alt="Foto del Trabajador" class="photo" onerror="this.src='https://via.placeholder.com/150'">
        </div>
        
        <h1 class="name" id="emp-name">NOMBRE DEL TRABAJADOR</h1>
        <p class="role" id="emp-role">CARGO</p>
        
        <div class="details">
            <div class="detail-item">
                <span class="detail-label">Cédula de Identidad:</span>
                <span class="detail-value" id="emp-cedula">V-XXXXXXXX</span>
            </div>
            <div class="detail-item">
                <span class="detail-label">ID de Credencial:</span>
                <span class="detail-value" id="emp-id">ECO-XXX</span>
            </div>
            <div class="detail-item">
                <span class="detail-label">Empresa:</span>
                <span class="detail-value">EPS Eco Peñalver, C.A.</span>
            </div>
        </div>
        
        <div class="status-active" id="emp-status">ACTIVO ✓</div>
    </div>

    <div id="error-card">
        <h1>❌ Credencial No Válida</h1>
        <p>El código escaneado no se encuentra registrado en nuestra base de datos o el ID es incorrecto.</p>
    </div>

    <script>

        const urlParams = new URLSearchParams(window.location.search);
        const empId = urlParams.get('id');

        if (empId && empleados[empId]) {

            document.getElementById('emp-name').innerText = data['Nombre'];
            document.getElementById('emp-role').innerText = data['Cargo'];
            document.getElementById('emp-cedula').innerText = data['Cédula'] ? "V-" + data['Cédula'] : "No registrada";
            document.getElementById('emp-id').innerText = empId;
            document.getElementById('emp-status').innerText = data['Estatus'] + " ✓";
            
            // CORRECCIÓN AQUÍ: Cambiamos .jpg a .jpeg para que coincida exactamente con los archivos subidos.
            document.getElementById('emp-photo').src = `https://atencionecopenalverca-rgb.github.io/sistema-carnets/foto-${empId}.jpeg`;
            document.getElementById('profile-card').style.display = 'block';
        } else {
            document.getElementById('error-card').style.display = 'block';
        }
    </script>
</body>
</html>
